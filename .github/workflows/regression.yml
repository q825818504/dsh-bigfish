name: dsh-bigfish regression

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, node: '22', arch: x64 }
          - { os: ubuntu-24.04, node: '22', arch: x64 }
          - { os: ubuntu-24.04, node: '24', arch: x64 }
          - { os: macos-15, node: '22', arch: arm64 }
          - { os: ubuntu-24.04-arm, node: '22', arch: arm64 }
          - { os: macos-15-intel, node: '22', arch: x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      # 记忆模块依赖 @deepseek-ai/schemastery（Host 侧 schema），必须装；
      # 其余测试只用 Node 内置模块。
      - name: Install
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression
        shell: bash
        run: |
          node -p "'Runtime: ' + process.version + ' ' + process.platform + '/' + process.arch"
          node test/memory-contract.test.js
          node test/scope-backup.test.js
          node test/mood-bridge.test.js
          node test/merged-client.test.mjs
          node test/decay.test.mjs
          node test/stale-judgments.test.mjs
          node test/bigfish-v1.test.mjs
